description: Tarif réduit de l'accise applicable aux gaz naturels utilisés comme combustibles
  dans les installations intensives en énergie exposées à la concurrence internationale non
  soumises au SEQE de l'UE mais relevant d'activités soumises au SEQE de l'UE
values:
  2022-01-01:
    value: 1.6
  2024-01-01:
    value: null
metadata:
  short_label: Accise gaz naturels combustibles industries concurrencées indirect SEQE
  label_en: Excise duty on natural gases used as heating fuels for competing industries indirectly under EU ETS
  ipp_csv_id: accise_gaz_naturel_comb_seqe_indirect
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne, article L312-75
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
    2024-01-01:
      title: Article 94 II K 2° de la loi n° 2023-1322 du 29 décembre 2023 de finances pour 2024
      href: https://www.legifrance.gouv.fr/eli/loi/2023/12/29/ECOX2322957L/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
    2024-01-01: "2023-12-30"
documentation: |-
  Tarif abrogé au 1er janvier 2024, les installations concernées relevant depuis lors du tarif
  normal. Une formula_2024_01_01 est ajoutée à taxe_accise_gaz_naturel_combustible pour écarter
  cette branche : jusqu'ici la formule de 2022 continuait de l'appliquer, si bien qu'un
  établissement exposé au risque de fuite de carbone et non soumis au SEQE était taxé à 1.6 au
  lieu du tarif normal, soit environ un dixième du montant dû.
