  notes:
    2022-01-01:
      - title: "Le tableau de l'article L. 312-36 du CIBS porte 8,45 €/MWh, mais ce n'est pas le tarif applicable : son dernier alinéa, dans sa version en vigueur du 1er janvier 2022 au 1er janvier 2024, prévoit que le tarif normal des gaz naturels est ce montant minoré de la part de biométhane injecté dans les réseaux, arrondie au centième, et constatée chaque année par arrêté conjoint des ministres du budget et de l'énergie. Les valeurs 2022 et 2023 sont donc celles des arrêtés, non celle du tableau."
    2023-01-01:
      - title: "L'article 1er de l'arrêté du 13 décembre 2022 donne les données du calcul : 4,3 TWh de biométhane injecté en 2021 pour 480 TWh de gaz consommé, soit une minoration de 0,896 %. 8,45 × (1 − 0,008958) = 8,3743, arrondi à 8,37."
    2024-01-01:
      - title: "Le mécanisme de minoration disparaît : la version de l'article L. 312-36 en vigueur au 1er janvier 2024 prévoit à la place que le tarif normal peut être majoré par arrêté, sans excéder 16,37 €/MWh."
    2025-08-01:
      - title: "L'article 20 de la loi de finances pour 2025 unifie a 10,54 €/MWh les tarifs normaux de l'article L. 312-36 du CIBS. Le A du XI de cet article fixe l'entrée en vigueur au 1er août 2025."
      - title: "Ce tarif est celui d'avant majoration. Depuis le 1er août 2025, l'article L. 312-37-1 du CIBS y ajoute la majoration au titre des zones non interconnectées (voir energies/majoration_zni), due par tous les redevables du tarif normal. Le tarif effectivement dû est de 15,43 €/MWh du 1er août 2025 au 31 janvier 2026, puis de 16,39 €/MWh, montants que l'article 1er de l'arrêté publie d'ailleurs côte à côte avec le tarif de base. C'est ce tarif majoré que citent la plupart des sources."
