description: Tarif réduit de l'accise sur l'électricité, applicable au transport de personnes
  et de marchandises par train, métro, tramway, câble et trolleybus
values:
  2022-01-01:
    value: 0.5
metadata:
  short_label: Accise électricité transport personnes marchandises
  label_en: Excise duty on electricity for passenger and freight transport
  ipp_csv_id: accise_electricite_transport_personnes_marchandises
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-02-24"
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne, article L312-48
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Succède, à compter de la réforme CIBS du 1er janvier 2022, au tarif réduit de TICFE
  (ticfe/transport_guide.yaml), clôturé à cette date. Valeur inchangée (0.5).
  Il s'agit du transport ferré ou guidé, à distinguer du transport collectif routier de
  personnes, qui relève d'un tarif distinct créé par le CIBS
  (accise/tarifs_reduits/transport_collectif_routier_personnes.yaml).
