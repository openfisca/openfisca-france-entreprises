description: Tarif réduit de l'accise sur l'électricité, applicable à l'électricité consommée
  par un centre de stockage de données numériques exploité par une entreprise
values:
  2022-01-01:
    value: 12
metadata:
  short_label: Accise électricité centres de stockage de données
  label_en: Excise duty on electricity for data centres
  ipp_csv_id: accise_electricite_data_centers
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne, article L312-64
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Succède, à compter de la réforme CIBS du 1er janvier 2022, au tarif réduit de TICFE
  (ticfe/data_center.yaml), clôturé à cette date. Valeur inchangée (12).
  Le tarif réduit ne s'applique qu'à la fraction de la consommation excédant un gigawattheure
  par an, seuil porté par ticfe/plafond_assiette_mwh.yaml.
