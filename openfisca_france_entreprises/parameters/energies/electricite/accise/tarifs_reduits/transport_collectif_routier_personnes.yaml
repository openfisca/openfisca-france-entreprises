description: Tarif réduit de l'accise sur l'électricité, applicable au transport collectif
  routier de personnes
values:
  2022-01-01:
    value: 0.5
metadata:
  short_label: Accise électricité transport collectif routier
  label_en: Excise duty on electricity for public road transport
  ipp_csv_id: accise_electricite_transport_collectif
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2022-01-01:
    - title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative
        du code des impositions sur les biens et services et transposant diverses
        normes du droit de l'Union européenne
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Tarif propre au transport collectif ROUTIER de personnes, créé par le CIBS. Avant 2022 il
  n'existait qu'un seul tarif réduit « transport », celui du transport ferré ou guidé (train,
  métro, tramway, câble, trolleybus), désormais porté par
  accise/tarifs_reduits/transport_personnes_marchandises.yaml.

  Ce fichier portait auparavant la description et l'identifiant de ce voisin ferré, ainsi qu'une
  date de début au 2016-01-01 sans fondement juridique. La date est corrigée au 2022-01-01
  conformément au barème IPP : aucune formule ne lisait ce tarif avant 2022, la correction est
  donc sans effet sur les résultats.
