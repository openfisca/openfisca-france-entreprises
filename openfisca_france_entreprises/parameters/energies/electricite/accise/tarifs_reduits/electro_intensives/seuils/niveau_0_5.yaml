description: Niveau minimal d'électro-intensité (0,5 % de la valeur ajoutée) ouvrant droit aux tarifs réduits d'accise sur l'électricité des entreprises électro-intensives
values:
  2022-01-01:
    value: 0.005
metadata:
  unit: /1
  reference:
    2022-01-01:
      title: Article L. 312-65 du code des impositions sur les biens et services
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044603709
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Le niveau d'électro-intensité est défini à l'article L. 312-44 comme le rapport entre le
  montant de l'accise et la valeur ajoutée : un ratio sans dimension, stocké ici sous l'unité
  /1.

  Ce palier est la condition d'éligibilité au régime. Il prolonge sans la modifier celle que
  l'article 266 quinquies C posait avant 2022 — une accise d'au moins 0,5 % de la valeur
  ajoutée —, déjà portée par seuils_seqe/part_taxe_valeur_ajoutee_min.
