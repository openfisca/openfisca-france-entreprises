documentation: |-
  Le niveau d'électro-intensité est défini à l'article L. 312-44 comme le rapport entre le
  montant de l'accise et la valeur ajoutée : un ratio sans dimension, stocké ici sous l'unité
  /1.

  Ce palier prolonge, sans le modifier, le seuil de 6 kWh par euro de valeur ajoutée que
  l'article 266 quinquies C appliquait avant 2022 : au tarif normal de 22,5 €/MWh, 6 kWh
  par euro représentent 13,5 % de la valeur ajoutée.
