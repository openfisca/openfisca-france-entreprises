description: Niveau d'électro-intensité de 3,375 % de la valeur ajoutée, deuxième palier des tarifs réduits d'accise sur l'électricité des entreprises électro-intensives
values:
  2022-01-01:
    value: 0.03375
metadata:
  unit: /1
  reference:
    2022-01-01:
      title: Article L. 312-65 du code des impositions sur les biens et services
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000044603709
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Le niveau d'électro-intensité est défini à l'article L. 312-44 comme le rapport entre le
  montant de l'accise et la valeur ajoutée : un ratio sans dimension, stocké ici sous l'unité
  /1.

  Ce palier prolonge, sans le modifier, le seuil de 1,5 kWh par euro de valeur ajoutée que
  l'article 266 quinquies C appliquait avant 2022 : au tarif normal de 22,5 €/MWh, 1,5 kWh
  par euro représentent 3,375 % de la valeur ajoutée.
