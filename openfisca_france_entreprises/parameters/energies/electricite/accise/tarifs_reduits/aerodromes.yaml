description: Tarif réduit de l'accise sur l'électricité, applicable aux exploitants
  d'aérodromes ouverts à la circulation aérienne publique
values:
  2022-01-01:
    value: 7.5
metadata:
  short_label: Accise électricité aérodromes
  label_en: Excise duty on electricity for airport operators
  ipp_csv_id: accise_electricite_aerodromes
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne, article L312-48
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: |-
  Succède, à compter de la réforme CIBS du 1er janvier 2022, au tarif réduit de TICFE
  (ticfe/aerodromes.yaml), clôturé à cette date. Valeur inchangée (7.5).
  Le bénéfice de ce tarif est subordonné à un niveau de consommation d'électricité rapporté
  à la valeur ajoutée, dont le seuil est porté par ticfe/seuil_consommation_par_va_52_23z.yaml.
