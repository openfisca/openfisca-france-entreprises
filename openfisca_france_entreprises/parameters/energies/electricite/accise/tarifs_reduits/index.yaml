documentation: |-
  Les tarifs à zéro correspondent aux exonérations prévues par le Code des impositions sur les
  biens et services. Le modèle les codait auparavant en dur dans les formules ; ils sont désormais
  portés par des paramètres, de sorte qu'un changement de tarif relève de la donnée et non du code.
