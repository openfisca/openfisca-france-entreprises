  notes:
    2022-01-01:
      - title: "Valeur deduite des agregats 2040-TIC, faute d'arrete localise. L'article L. 312-37 du CIBS date lui-meme son tableau : les tarifs y sont donnes « en 2015 » — 25,6875 pour les menages —, et « la fraction du tarif superieure a 22,5 EUR par megawattheure est indexee sur l'inflation ». Le bareme portait donc une valeur de 2015 comme si c'etait le tarif 2022. La declaration 2040-TIC donne le tarif applique en janvier 2022, avant que le bouclier tarifaire ne prenne effet au 1er fevrier : la case _911321 declare 25,8291 EUR/MWh sur 27 843 314 MWh, soit 22,50 + 3,3291. La case _911323 (petites et moyennes entreprises) declare 23,6097, soit 22,50 + 1,1097. Les deux fractions indexees sont dans le rapport 1,044424 avec celles de 2015 (3,1875 et 1,0625), a six decimales et sur deux regimes distincts : c'est donc une indexation unique et non deux ecarts independants. Le tarif haute puissance, egal a 22,50 soit exactement le plancher d'indexation, est inchange — ce qui corrobore la lecture. ATTENTION : l'arrete qui constate ces montants pour 2022 n'a ete localise ni par Paul ni par une recherche sur l'API PISTE. Soit l'indexation 2022 est automatique et ne fait l'objet d'aucun arrete, le CIBS n'entrant en vigueur qu'au 1er janvier 2022, soit ce texte existe et reste a trouver. La valeur est validee sur la seule foi de la declaration fiscale."
      - title: "Question ouverte : les valeurs 2023 et 2024 (32,0625) sont elles aussi des montants de reference recalcules — 22,5 + 4,25 x 0,75 + 8,5 x 0,75 — et non des tarifs indexes. Les agregats ne permettent pas de les deduire, le bouclier tarifaire s'etant substitue aux tarifs normaux du 1er fevrier 2022 au 31 janvier 2025. La valeur du 1er fevrier 2025 (33,70), elle, est sourcee par arrete."
    2025-08-01:
      - title: "Nouvelle table de l'article L. 312-37 du CIBS issue de l'article 20 de la loi de finances pour 2025. Le A du XI de cet article fixe l'entrée en vigueur au 1er août 2025 (date d'application du tarif, verifiee sur le nota de la version consolidee)."
      - title: "Ce tarif est celui d'avant majoration. Depuis le 1er août 2025, l'article L. 312-37-1 du CIBS y ajoute la majoration au titre des zones non interconnectées (voir energies/majoration_zni), due par tous les redevables du tarif normal. Le tarif effectivement dû est de 29,98 €/MWh du 1er août 2025 au 31 janvier 2026, puis de 30,85 €/MWh, montants publiés à l'article 1-2 de l'arrêté."
    2026-02-01:
      - title: "Révision annuelle au 1er février prévue par l'article L. 312-37 du CIBS : la fraction du tarif supérieure à 19,24 €/MWh est indexée sur l'inflation sous-jacente, le résultat étant arrondi au centième."
documentation: |-
  Au premier janvier 2022, les taxes sur l'énergie sont basculées vers le Code des impositions des biens et services.
  Dans le même temps, la TDCFE (en 2022) et la TCCFE (en 2023) sont incorporées à l'ancienne TICFE devenue fraction de l'accise sur l'énergie sur l'électricité.
  Ces taxes locales n'étant prélevées qu'auprès des consommateurs de moyenne et basse puissance (petits professionnels et particuliers, respectivement), ceci introduit une différenciation des taux de TICFE (auparavant opérée par l'addition de la TICFE et de la TDCFE/TCCFE).
  Ainsi, la valeur pour les particuliers vaut en 2022 : 25.6875 = 22.5 (taux historique de la TICFE) + 4.25 * 0.75, où 4.25 est le coefficient multiplicateur maximal de l'ancienne TDCFE et 0.75 le taux de base pour les consommateurs basse puissance.
  Au premier janvier 2023, elle vaut 32.0625 = 22.5 + 4.25*0.75 + 8.5*0.75, où 8.5 est le coefficient multiplicateur maximal de la TCCFE.
  Cependant, ces mesures sont interrompues par la mise en place du bouclier tarifaire en réponse à l'invasion russe en Ukraine.
