metadata:
  short_label: Tarif normal de l'accise sur l'électricité pour haute puissance
  last_value_still_valid_on: "2026-07-24"
  label_en: Standard rate of excise duty on electricity for high-power companies
  ipp_csv_id: accise_normale_electricite_haute_puissance
  unit: currency_per_mwh
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
    2025-08-01:
      title: Article 20 de la loi n° 2025-127 du 14 février 2025 de finances pour 2025
      href: https://www.legifrance.gouv.fr/eli/loi/2025/2/14/2025-127/jo/texte
    2026-02-01:
      title: Article 1-1 de l'arrêté du 13 décembre 2022, dans sa rédaction issue de l'article 2 de l'arrêté du 24 décembre 2025 constatant les tarifs de certaines impositions sur les biens et services
      href: https://www.legifrance.gouv.fr/eli/arrete/2025/12/24/CPPE2534454A/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
    2025-08-01: "2025-02-15"
    2026-02-01: "2025-12-31"
  notes:
    2025-08-01:
      - title: "Nouvelle table de l'article L. 312-37 du CIBS issue de l'article 20 de la loi de finances pour 2025. Le A du XI de cet article fixe l'entrée en vigueur au 1er août 2025 (date d'application du tarif, verifiee sur le nota de la version consolidee)."
      - title: "Ce tarif est celui d'avant majoration. Depuis le 1er août 2025, l'article L. 312-37-1 du CIBS y ajoute la majoration au titre des zones non interconnectées (voir energies/majoration_zni), due par tous les redevables du tarif normal. Le tarif effectivement dû est de 25,79 €/MWh du 1er août 2025 au 31 janvier 2026, puis de 26,58 €/MWh, montants publiés à l'article 1-2 de l'arrêté."
    2026-02-01:
      - title: "Révision annuelle au 1er février prévue par l'article L. 312-37 du CIBS : la fraction du tarif supérieure à 19,24 €/MWh est indexée sur l'inflation sous-jacente, le résultat étant arrondi au centième."
