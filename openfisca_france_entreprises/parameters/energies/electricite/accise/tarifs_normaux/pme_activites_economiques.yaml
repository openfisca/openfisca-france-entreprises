documentation: |-
  Au premier janvier 2022, les taxes sur l'énergie sont basculées vers le Code des impositions des biens et services.
  Dans le même temps, la TDCFE (en 2022) et la TCCFE (en 2023) sont incorporées à l'ancienne TICFE devenue fraction de l'accise sur l'énergie sur l'électricité.
  Ces taxes locales n'étant prélevées qu'auprès des consommateurs de moyenne et basse puissance (petits professionnels et particuliers, respectivement), ceci introduit une différenciation des taux de TICFE (auparavant opérée par l'addition de la TICFE et de la TDCFE/TCCFE).
  Ainsi, la valeur normale pour les petits professionnels vaut au 1er janvier 2022 : 23.5625 = 22.5 (taux historique de la TICFE) + 4.25 * 0.25, où 4.25 est le coefficient multiplicateur maximal de l'ancienne TDCFE et 0.25 le taux de base pour les consommateurs moyenne puissance.
  Au 1er janvier 2023, elle vaut 25.6875 = 22.5 + 4.25*0.25 + 8.5*0.25, où 8.5 est le coefficient multiplicateur maximal de la TCCFE.
  La fraction excédant 22.5 euros (correspondant aux majorations dues à l'intégration des anciennes TLCE) est indexée annuellement sur l'indice des prix à la consommation hors tabac.
  A partir du 1er janvier 2022 et jusqu'au 31 janvier 2025, ces tarifs normaux sont remplacés par des minorations exceptionnelles connues sous le nom de "bouclier tarifaire".
