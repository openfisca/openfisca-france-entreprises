  documentation: La TDCFE est calculée en appliquant un coefficient, choisi par le
    conseil départemental, à une valeur de référence. Ce coefficient est encadré par
    un minimum et un maximum fixés par la loi. A partir de 2021, les coefficients
    départementaux sont homogénéisés jusqu'à atteindre 4,25 ; la TDCFE est ensuite
    incorporée à la TICFE.
