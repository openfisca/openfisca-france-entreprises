description: Tarif réduit de l'accise sur l'électricité, applicable au transport collectif
  routier de personnes
values:
  2016-01-01:
    value: 0.5
metadata:
  short_label: Accise électricité transport collectif routier
  label_en: Excise duty on electricity for public road transport
  ipp_csv_id: accise_electricite_transport_collectif
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2016-01-01:
    - title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative
        du code des impositions sur les biens et services et transposant diverses
        normes du droit de l'Union européenne
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
documentation: |-
  Ce fichier portait jusqu'ici la description et l'ipp_csv_id (ticfe_transport) de son voisin
  transport_guide.yaml : il décrivait le transport ferré/guidé (train, métro, tramway, câble,
  trolleybus) alors qu'il porte le tarif du transport collectif ROUTIER de personnes. Description
  et identifiant repris du barème IPP (accise/tarifs_reduits/transport_collectif_routier_personnes).

  ATTENTION - divergence de date restante, à traiter dans la passe CIBS.
  Le barème IPP ne connaît ce tarif qu'à partir du 2022-01-01 : avant la réforme CIBS il n'existait
  qu'un seul tarif réduit « transport » (le ferré/guidé, cf. transport_guide.yaml), et le tarif
  routier est une création du Code des impositions sur les biens et services. La valeur est laissée
  au 2016-01-01 pour ne pas casser les formules de taxation_electricite.py qui le lisent avant 2022.
