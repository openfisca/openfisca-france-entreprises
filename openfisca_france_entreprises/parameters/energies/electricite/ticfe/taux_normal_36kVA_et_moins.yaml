  documentation: Au premier janvier 2022, les taxes sur l'énergie sont basculées vers
    le Code des impositions des biens et services ; TDCFE (2022) et TCCFE (2023) sont
    incorporées à la TICFE. Valeur particuliers 2022 25,6875 = 22,5 + 4,25×0,75 ;
    2023 32,0625 = 22,5 + 4,25×0,75 + 8,5×0,75.
