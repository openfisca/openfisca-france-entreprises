description: Intensité minimale des échanges avec les pays tiers du secteur d'activité, condition d'accès au tarif réduit des installations hyperélectro-intensives
values:
  2016-01-01:
    value: 25
metadata:
  unit: percent
  reference:
    2016-01-01:
      title: Article 266 quinquies C du code des douanes
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000031814811
documentation: |-
  Le C-b de l'article retient les installations dont le secteur a une intensité des échanges
  avec des pays tiers « supérieure à 25 % ». Exprimée en pourcentage, comme la variable
  intensite_echanges_avec_pays_tiers du modèle.
