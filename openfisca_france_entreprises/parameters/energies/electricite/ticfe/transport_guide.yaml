description: Taxe intérieure sur la consommation finale d'électricité pour les personnes
  exerçant une activité de transport de personnes et de marchandises par train, métro,
  tramway, câble et trolleybus
values:
  2016-01-01:
    value: 0.5
metadata:
  ipp_csv_id: ticfe_transport
  unit: currency_per_mwh
  reference:
    2016-01-01:
      title: article 14 de la loi n° 2015-1786 du 29 décembre 2015 de finances rectificative
        pour 2015
      href: https://www.legifrance.gouv.fr/eli/loi/2015/12/29/FCPX1525022L/jo/texte
documentation: |-
  Au 1er janvier 2017, le bénéfice de ce taux réduit est étendu aux
  autobus hybrides rechargeables ou électriques (article 27 de la loi n° 2016-1917
  du 29 décembre 2016 de finances pour 2017). Au 1er janvier 2022, la réglementation
  ne change pas, mais est déplacée dans le Code des impositions des biens et services.
  On signale ce changement majeur.
