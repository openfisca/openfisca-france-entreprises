description: Part minimale des achats de produits énergétiques et d'électricité dans la valeur de la production caractérisant une entreprise grande consommatrice d'énergie
values:
  2000-01-01:
    value: 0.03
metadata:
  unit: /1
  reference:
    2000-01-01:
    - title: Article 265 nonies du code des douanes
      href: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028408115
    - title: Article 17, paragraphe 1, point a) de la directive 2003/96/CE du Conseil du 27 octobre 2003 restructurant le cadre communautaire de taxation des produits énergétiques et de l'électricité
      href: https://eur-lex.europa.eu/eli/dir/2003/96/oj
documentation: |-
  L'article 17 retient les entreprises dont les achats de produits énergétiques et
  d'électricité atteignent au moins 3 % de la valeur de la production.

  L'article 265 nonies du code des douanes, en vigueur du 1er avril 2014 au 1er janvier 2022,
  réserve son tarif réduit aux « personnes qui exploitent des installations grandes consommatrices
  d'énergie au sens de l'article 17 de la directive 2003/96/CE » exerçant une activité relevant de
  l'annexe I de la directive 2003/87/CE, c'est-à-dire soumises au système d'échange de quotas
  d'émission — d'où le nom de ce répertoire. Il ne reprend pas les seuils chiffrés : ceux-ci sont
  dans la directive, d'où la double référence.

  La date d'effet 2000-01-01 est un artefact, antérieure tant à la directive qu'à l'article. Elle
  n'est pas corrigée ici : openfisca-france-entreprises lit seuils_seqe depuis une formule sans
  date (caracteristiques_etablissement.py), donc pour toute période, et redater changerait le
  calcul. À arbitrer avec le modèle.
