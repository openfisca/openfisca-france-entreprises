documentation: |-
  Le SP95-E10 (indice 11 ter) n'a été créé qu'au 1er janvier 2019 par l'article 66 de la loi de finances
  pour 2019 : la réfaction ne lui est donc applicable qu'à compter de cette date, alors qu'elle bénéficie
  aux SP95 et SP98 depuis 2002. C'est la seule différence légale connue entre ces carburants.
  Euros par hectolitre avant 2022, euros par MWh à partir de 2022.
