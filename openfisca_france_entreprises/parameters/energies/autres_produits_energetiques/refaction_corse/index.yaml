description: Réfaction corse de l'accise sur les supercarburants (TICPE)
metadata:
  label_en: Corsican abatement on petrol excise duty
  order:
  - supercarburants_sp95_sp98
  - supercarburant_sp95_e10
  - supercarburant_plombe
documentation: |-
  Minoration propre à la Corse, **distincte de la majoration régionale**, prévue à l'article 265 A bis
  du code des douanes puis à l'article L312-41 du code des impositions sur les biens et services.

  Elle ne se distingue pas selon le carburant par son montant, identique, mais par sa **date d'entrée
  en vigueur** : 2002 pour les supercarburants SP95 et SP98 (indice d'identification 11), 2019 seulement
  pour le SP95-E10 (indice 11 ter), créé par l'article 66 de la loi de finances pour 2019 — seule
  différence légale connue entre ces carburants, et qui ne relève pas de la majoration régionale.

  Unités : euros par hectolitre avant 2022, euros par MWh à partir de 2022 ; le passage de 1,0 à 1,125
  au 2022-01-01 est la conversion d'unité propre aux supercarburants (~0,88 MWh/hL), non une hausse.

  Identifiants (refaction_corse_ticpe_*) et valeurs alignés sur openfisca-france-entreprises.
