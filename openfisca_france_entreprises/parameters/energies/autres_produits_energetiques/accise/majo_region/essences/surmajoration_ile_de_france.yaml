documentation: |-
  Majoration additionnelle réservée à la région d'Île-de-France par l'article L. 312-40 du CIBS, au profit d'Île-de-France Mobilités. Elle prend la suite de l'article 265 A ter du code des douanes et se cumule avec la majoration de l'article L. 312-39.

  Elle survit d'un semestre à la majoration de droit commun : l'article 20 de la loi de finances pour 2025 abroge l'article L. 312-39 au 1er août 2025, mais l'article L. 312-40 au 1er janvier 2026 seulement.
