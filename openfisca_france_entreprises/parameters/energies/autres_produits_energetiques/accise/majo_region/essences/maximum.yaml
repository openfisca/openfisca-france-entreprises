documentation: |-
  Plafond fixé par l'article L. 312-39 du code des impositions sur les biens et services : 0,821 €/MWh pour la catégorie fiscale des essences.

  Le CIBS exprime la majoration en €/MWh alors que la douane publie les tarifs régionaux en €/hL. Les deux montants coïncident : la conversion officielle vaut 1 MWh par hL pour les gazoles (59,40 €/MWh = 59,40 €/hL) et 0,8889 MWh par hL pour les essences (76,826 €/MWh = 68,29 €/hL), de sorte que le plafond de 0,821 €/MWh vaut 0,73 €/hL.
