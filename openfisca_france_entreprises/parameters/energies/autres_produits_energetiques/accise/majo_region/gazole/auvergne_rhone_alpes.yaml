    2022-01-01:
      - title: "Seule région à ne pas retenir le plafond. L'annexe 1.1 lui donne 60,48 €/hL sur le gazole et 68,87 €/hL sur le SP95-E5, soit une majoration de 1,08 et 0,58 €/hL, contre 1,35 et 0,73 pour le plafond."
