description: Tarif réduit de l'accise applicable aux gazoles utilisés pour l'extraction de minéraux industriels
values:
  2022-01-01:
    value: 3.86
metadata:
  short_label: Accise gazoles pour extraction de minéraux
  label_en: Excise duty on diesel for mineral extraction
  ipp_csv_id: accise_gazoles_extraction_mineraux
  unit: currency_per_mwh
  last_value_still_valid_on: "2025-03-04"
  reference:
    2022-01-01:
      title: 3° e) de l'article 37 de l'ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
documentation: |-
  ATTENTION - divergence connue avec le barème IPP, à corriger avec la formule associée.
  Le barème IPP date l'entrée en vigueur de ce tarif réduit au 2023-01-01 (et non 2022-01-01),
  ce qui est cohérent avec son fichier frère gazoles_manutention_portuaire.yaml, daté 2023-01-01.
  La correction de la date ne peut pas être faite ici seule : taxation_autres_produits_energetiques.py
  lit ce paramètre dans formula_2022_01_01, qui lève ParameterNotFoundError si la valeur ne commence
  qu'en 2023. Corriger la date suppose de scinder une formula_2023_01_01. À traiter dans la passe
  « formules ».
