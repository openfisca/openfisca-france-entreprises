documentation: |-
  Comme exprimé à l'article L312-25 du Code des impositions sur les biens et services, les tarifs appliqués aux produits taxables sont exprimés en euro par unité de la base d'imposition déterminée dans les conditions prévues à l'article L. 312-19.
  Lorsque l'unité n'est pas le MWh, ces tarifs sont obtenus par conversion du MWh vers cette unité selon un coefficient égal au pouvoir calorifique inférieur du produit représentatif de chaque catégorie, repris dans l'article 2.3 de l'arrêté du 13 décembre 2022 constatant divers tarifs et seuils de régime d'impositions relatifs à certaines impositions sur les biens et services
  Pour les carburéacteurs, cela s'illustre ainsi (pour l'année 2024): 76.826 €/MWh = 72.56 €/hL / (3.4 GJ/hL * 0.277778 MWh/GJ)
