documentation: |-
  L'article subordonne la minoration à l'autorisation européenne donnée par la décision
  d'exécution (UE) 2019/372 du Conseil du 5 mars 2019, et cesse de s'appliquer à la première des
  échéances qu'elle prévoit. Une version ultérieure de l'article, non encore datée, étend la
  minoration aux gazoles et aux gaz de pétrole liquéfiés combustible et en renvoie les montants
  à un arrêté.
