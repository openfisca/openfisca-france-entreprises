documentation: |-
  Exonérations (tarifs réduits à zéro) que le code des impositions sur les biens et services définit
  sans distinction de grade : les articles L. 312-54 à L. 312-58 et L. 312-66 à L. 312-69 les portent
  dans un tableau CONSOMMATION × CATÉGORIE FISCALE où la catégorie vaut « Toutes » ou « Toutes sauf
  électricité », précisée dans la documentation de chaque paramètre. Ces six exonérations sont donc décrites par
  un seul paramètre chacune, à l'image d'OpenFisca-France-Entreprises, plutôt qu'éclatées en un fichier
  par grade (huiles légères / moyennes / lourdes / hydrocarbures gazeux liquéfiés × carburant /
  combustible). Valeurs toutes nulles : l'agrégat est numériquement identique à l'ancien découpage.

  Restent différenciés par grade, sous accise/{carburants,combustibles}/<grade>/tarifs_reduits/, les
  tarifs réellement distincts selon le carburant (taxi, transports guidé/collectif/routier, usages
  agricoles/forestiers, extraction et manutention, montagnes, travaux statiques). L'exonération
  d'intervention des véhicules d'incendie et de secours (art. 50 de la loi n° 2023-580) y reste
  également : la loi ne la place pas dans le tableau ci-dessus et le barème ne la code que pour les
  essences et gazoles ; sa mise à plat suppose de confirmer d'abord qu'elle vaut pour toutes les
  catégories fiscales et non pour les seuls carburants routiers.
