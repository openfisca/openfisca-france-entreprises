description: Tarif réduit de l'accise applicable aux produits énergétiques utilisés pour l'intervention des véhicules des services d'incendie et de secours
values:
  2022-01-01:
    value: 0
metadata:
  short_label: Accise produits énergétiques pour véhicules incendie et secours
  last_value_still_valid_on: "2025-03-04"
  label_en: Excise duty on energy products for intervention by fire and rescue service vehicles
  unit: currency_per_mwh
  reference:
    2023-07-12:
      title: Article 50 de la loi n° 2023-580 du 10 juillet 2023 visant à renforcer la prévention et la lutte contre l'intensification et l'extension du risque incendie
      href: https://www.legifrance.gouv.fr/eli/loi/2023/7/10/TREX2309187L/jo/texte
  official_journal_date:
    2023-07-12: "2023-07-11"
documentation: |-
  Le barème date ce tarif réduit du 2023-07-12 (art. 50 de la loi 2023-580). Le modèle l'applique
  toutefois dès 2022 : sa formule taxe_interieure_consommation_sur_produits_energetiques lit ce
  tarif à partir de formula_2022_01_01, et l'ouverture au 2022-01-01 (valeur nulle) préserve le
  comportement existant tout en évitant un ParameterNotFound. L'écart de date (2022 côté modèle,
  2023-07-12 au barème) est une divergence à arbitrer : avant l'entrée en vigueur de la réfaction,
  ces véhicules relevaient-ils du tarif normal ? Cf. SYNC_ENERGIES_REPORT.md.
