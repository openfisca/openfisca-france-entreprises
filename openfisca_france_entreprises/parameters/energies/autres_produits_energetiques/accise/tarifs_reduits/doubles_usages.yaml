      - title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services
        href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/2021-1843/jo/texte
documentation: |-
  Exonération (tarif réduit à zéro) définie par l'article L. 312-66 du CIBS pour la catégorie fiscale
  « Toutes ». La loi ne distingue pas le grade de produit : l'exonération s'applique en bloc à toutes
  les catégories fiscales.
