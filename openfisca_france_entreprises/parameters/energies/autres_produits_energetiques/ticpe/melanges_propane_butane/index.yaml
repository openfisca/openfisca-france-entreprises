documentation: |-
  Indices d'identification 31 et voisins. Au 1er janvier 2000, les mélanges de propane et de butane
  ont été incorporés aux catégories propane liquéfié / butanes liquéfiés selon l'alcane majoritaire ;
  ces séries s'arrêtent donc à cette date (importées du barème IPP, join par ipp_csv_id).
