documentation: |-
  Majoration additionnelle que l'article 265 A ter du code des douanes réserve à la région d'Île-de-France, au profit d'Île-de-France Mobilités, pour financer le dézonage du Pass Navigo. Elle se cumule avec la majoration régionale de droit commun de l'article 265 A bis :
  le tarif francilien de l'annexe 1.1 des douanes vaut le tarif national augmenté de la somme des deux plafonds.

  Le plafond est de 1,89 EUR/hL pour les gazoles et de 1,02 EUR/hL pour les supercarburants ; l'Île-de-France l'a appliqué à son maximum dès 2017.
