documentation: |-
  Montant de la fraction de TIPP transférée aux régions, comprise dans le tarif national
  porté par le barème : 1,77 €/hL pour les supercarburants. Le tarif national passe de
  58,92 €/hL en 2004 à 60,69 €/hL en 2006, soit exactement cet écart, au moment où la
  fraction régionale y est intégrée.

  Chaque région pouvait moduler cette fraction à la hausse ou à la baisse, sous forme d'une
  réfaction appliquée au tarif national : la circulaire douanière du 29 mars 2013 relative à
  la régionalisation de la TICPE, référencée ci-dessus, décrit le mécanisme et en donne des
  exemples chiffrés. La majoration « Grenelle » de l'article 265 A bis, plafonnée à
  1,35 €/hL sur le gazole et 0,73 €/hL sur les supercarburants, est venue s'ajouter
  par-dessus à partir de 2011.

  ATTENTION — ce paramètre ne doit plus être retranché des fichiers de région. Ceux-ci portent
  désormais la majoration régionale **nette**, c'est-à-dire l'écart au tarif national, qui est
  directement la grandeur publiée en annexe 1.1 des circulaires douanières. Cette base
  n'est conservée que pour mémoire, et pour permettre de reconstituer la valeur absolue
  d'origine (absolu = net + base) là où une série historique en dépendait.

  La fraction disparaît avec le passage au code des impositions sur les biens et services au
  1er janvier 2022 : la majoration de l'article L. 312-39 s'ajoute alors directement au tarif
  normal, sans composante nationale à isoler.
