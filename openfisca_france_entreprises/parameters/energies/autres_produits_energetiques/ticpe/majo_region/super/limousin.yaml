      - title: "Région supprimée par la fusion du 1er janvier 2016. Les anciens tarifs ont continué de courir pendant toute l'année 2016 : l'annexe 1.1 des circulaires douanières listait encore les 22 anciennes régions pour l'année 2016, et ne retient que les 13 nouvelles à partir de l'année 2017. La fermeture est donc posée au 1er janvier 2017, date du premier tarif harmonisé."
