documentation: |-
  La réfaction est prévue à l'article 265 quinquies du code des douanes, qui minore d'un euro
  par hectolitre le tarif du tableau B de l'article 265 pour les supercarburants destinés à être
  utilisés en Corse ou livrés dans les ports de Corse à l'avitaillement des bâtiments de plaisance
  et de sport.

  L'article 7 de l'ordonnance n° 2021-1843 l'abroge au 1er janvier 2022, en même temps que
  l'article 265 lui-même : la série est donc close à cette date. Le dispositif est repris sous le
  régime de l'accise, en euros par mégawattheure et pour l'ensemble de la catégorie fiscale des
  essences, par l'article L. 312-41 du code des impositions sur les biens et services — voir
  autres_produits_energetiques/accise/minoration_corse.
