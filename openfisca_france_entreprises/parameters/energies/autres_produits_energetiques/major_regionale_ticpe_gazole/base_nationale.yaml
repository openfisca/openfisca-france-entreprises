  short_label: Base nationale majoration gazole
documentation: |-
  Les fichiers de région portent la valeur ABSOLUE de la majoration régionale telle que publiée par
  le barème IPP. La contribution effective à la taxe est l'écart entre cette valeur absolue et la
  composante nationale ci-dessous, déjà incluse dans le tarif national (taux_gazoles) : la formule
  calcule donc `majoration_region - base_nationale`. Cette base reproduit exactement les anciens
  écarts stockés par le modèle là où modèle et barème concordaient ; là où ils divergent, la taxe
  change (voir la note de synchronisation / l'issue OFF-E dédiée). La hausse 2013 (+1,00) reflète une
  variation nationale d'accise, annulée en 2014.
