description: Tarif réduit de l'accise applicable aux charbons utilisés dans les installations de valorisation de la biomasse
values:
  2022-01-01:
    value: 0
metadata:
  short_label: Accise charbons valorisation biomasse
  last_value_still_valid_on: "2025-03-04"
  label_en: Excise duty on coals for biomass valorization
  ipp_csv_id: accise_charbons_biomasse
  unit: currency_per_mwh
  reference:
    2022-01-01:
      title: Ordonnance n° 2021-1843 du 22 décembre 2021 portant partie législative du code des impositions sur les biens et services et transposant diverses normes du droit de l'Union européenne
      href: https://www.legifrance.gouv.fr/eli/ordonnance/2021/12/22/ECOE2120672R/jo/texte
  official_journal_date:
    2022-01-01: "2021-12-29"
documentation: D'après l'article L312-78 au 1er janvier 2022, "Relèvent d'un tarif réduit de l'accise les charbons consommés pour les besoins de la valorisation de la biomasse dans les installations qui répondent aux conditions cumulatives suivantes:" 1° Elles sont exploitées par des entreprises dont le niveau d'intensité énergétique, apprécié sur les seules consommations mentionnées au premier alinéa, est au moins égal à 3 % en valeur de production ; 2° Elles sont soumises au système communautaire d'échange de quotas de gaz à effet de serre dans l'Union ou à des dispositions d'un accord conclu avec l'autorité administrative permettant d'atteindre des objectifs équivalents en matière de protection de l'environnement ou d'efficacité énergétique.
