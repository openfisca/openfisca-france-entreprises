    2026-02-01:
      title: Article 1er de l'arrêté du 13 décembre 2022, dans sa rédaction issue de l'article 2 de l'arrêté du 24 décembre 2025 constatant les tarifs de certaines impositions sur les biens et services
      href: https://www.legifrance.gouv.fr/eli/arrete/2025/12/24/CPPE2534454A/jo/texte
