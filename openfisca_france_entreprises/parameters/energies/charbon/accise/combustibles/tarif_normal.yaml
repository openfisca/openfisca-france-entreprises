    2022-01-01: "2021-12-29"
    2025-08-01: "2025-02-15"
    2026-02-01: "2025-12-31"
  notes:
    2025-08-01:
      - title: "L'article 20 de la loi de finances pour 2025 unifie a 10,54 €/MWh les tarifs normaux de l'article L. 312-36 du CIBS (charbons, fiouls lourds, fiouls domestiques, petroles lampants, gaz naturels combustible). Le A du XI de cet article fixe l'entrée en vigueur au 1er août 2025."
      - title: "Ce tarif est celui d'avant majoration. Depuis le 1er août 2025, l'article L. 312-37-1 du CIBS y ajoute la majoration au titre des zones non interconnectées (voir energies/majoration_zni), due par tous les redevables du tarif normal. Le tarif effectivement dû est de 15,43 €/MWh du 1er août 2025 au 31 janvier 2026, puis de 16,39 €/MWh. L'article 1er de l'arrêté fixe d'un même mouvement les charbons et les gaz naturels combustibles."
