documentation: |-
  Majoration prevue a l'article L. 312-37-1 du code des impositions sur les biens et services (CIBS), cree par la loi de finances pour 2025. Elle s'ajoute aux tarifs normaux resultant des articles L. 312-36 (combustibles) et L. 312-37 (electricite) : elle ne constitue donc pas un tarif autonome mais un supplement applicable aux deux familles, d'ou son placement a la racine de l'arborescence.
  Son montant est determine chaque annee civile comme le quotient entre, au numerateur, le montant a financer au titre des zones non interconnectees (article L. 121-10 du code de l'energie) et, au denominateur, la quantite totale d'energie relevant des tarifs normaux concernes. Pour 2026, ces donnees sont fixees a l'article 0-2 de l'arrete du 13 decembre 2022 : 3 648 millions d'euros a financer et 644 terawattheures consommes en 2024.
  L'article L. 312-37-1 precise que la majoration est applicable aux consommations intervenant du 1er fevrier d'une annee civile au 31 janvier de l'annee suivante, ce qui explique la date d'effet au 1er fevrier et non au 1er janvier.
  La loi de finances pour 2026 (article 72, III) a ensuite scinde la periode : la majoration est portee a 5,93 euros par megawattheure du 1er aout 2026 au 31 janvier 2027. Cette valeur, posterieure a la date du jour, est portee par une branche dediee et n'a pas vocation a figurer sur master tant qu'elle n'est pas entree en vigueur.
