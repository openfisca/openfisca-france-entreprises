# Test de l'assiette TICGN pour différentes périodes
#
# L'assiette de la TICGN est mensuelle depuis la bascule en definition_period = MONTH.
# Ces cas vérifient la composition de l'assiette — quelles consommations s'ajoutent, lesquelles
# se retranchent —, qui est purement linéaire : les énoncer au mois plutôt qu'à l'année laisse
# les quantités et les attendus inchangés. Seule la maille de la période change.
#
# date_installation_cogeneration reste une caractéristique annuelle de l'établissement : elle
# porte donc sa propre période dans l'input.

- name: "Test 1988 (exonération matière première, huiles minérales, chauffage habitation)"
  period: 1999-01
  input:
    consommation_gaz_combustible: 500
    consommation_gaz_chauffage_habitation: 200
  output:
    assiette_ticgn : 300
#en utilisant formula_1986_01_01

- name: "Test en 2000 (ajout de l'exonération production électricité)"
  period: 2000-01
  input:
    consommation_gaz_combustible: 500
    consommation_gaz_chauffage_habitation: 200
    date_installation_cogeneration:
      2000: 2000
    consommation_gaz_cogeneration: 100
  output:
    assiette_ticgn : 200
#en utilisant formula_2007_01_01

- name: "Test en 2006"
  period: 2006-01
