- name: test 2024  taxe_electricite_bouclier_tarifaire
#
  period: 2024 #2024-01-01
  relative_error_margin: 0.000001
  input:
    assiette_taxe_electricite: 1000
  output:
    # 2024 est une annee de bascule du bouclier : janvier releve encore du bouclier ouvert au
    # 1er fevrier 2023, a 0,50 EUR/MWh pour les entreprises, et fevrier-decembre du bouclier de
    # 2024, a 20,50. Une quantite fournie a l'annee etant repartie sur douze mois :
    # 1000 * (0,50 / 12 + 20,50 * 11 / 12) = 18 833,33.
    taxe_electricite_bouclier_tarifaire: 18833.333333

