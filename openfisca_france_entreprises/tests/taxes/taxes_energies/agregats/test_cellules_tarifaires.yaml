# Cellules tarifaires — quantité déclarée → montant déclaré
#
# Fichier généré par scripts/agregats_tic/generer_tests.py — ne pas éditer à la main.
# Source : assets/agregats.csv, agrégats annuels de la déclaration 2040-TIC
# déposée par les fournisseurs d'énergie.
#
# Chaque cas reprend la quantité et le montant réellement déclarés pour une case
# et un millésime. Le millésime est l'année de dépôt ; la période du test est
# l'année du tarif porté par la case.
#
# Les variables de consommation étant mensuelles, la quantité n'est pas répartie
# sur l'année mais posée sur un mois où s'applique le tarif que la case déclare.
# Une case de la 2040-TIC est en effet une cellule tarifaire homogène : elle porte
# la quantité taxée à *son* tarif, qu'elle nomme souvent dans son propre libellé.
# La répartir sur douze mois ferait calculer au modèle une moyenne annuelle que la
# déclaration ne pratique jamais.
#
# CERTAINS CAS ÉCHOUENT, ET C'EST VOULU — c'est même la raison d'être du fichier.
# Toute cellule que le modèle sait calculer est émise, y compris quand son résultat
# contredit la déclaration. Ces cas portent une annotation « DÉSACCORD » qui en dit
# la nature et renvoie au constat correspondant d'AGREGATS_TIC.md.
#
# Le principe : la déclaration fiscale a raison ; le calculateur — et le barème —
# peuvent avoir tort. Un désaccord rangé hors du chemin est un désaccord tu.
#
# Ne pas « réparer » la suite en recalculant ces attendus sur ce que rend le modèle :
# ce sont des montants réellement déclarés, ils vérifient le droit. Les aligner sur
# le calcul ferait disparaître le désaccord au lieu de le résoudre.

