# Vérifie que les cinq activités exonérées d'accise sur l'électricité restent taxées à zéro
# après leur passage en paramètres (tarifs_reduits) au lieu du zéro codé en dur.
# Couvre les trois versions de formule de taxe_accise_electricite : 2022, 2023 (ajout
# manutention_portuaire) et 2025 (ajout alimentation aéronefs). Chaque tarif réduit vaut 0
# au barème à ce jour ; le test garantit que assiette × tarif reste nul de part et d'autre
# des dates charnières, et se mettra à jour automatiquement si le barème publiait un tarif non nul.

- name: exoneration doubles usages 2022
  period: 2022
  input:
    electricite_double_usage: 500
    assiette_taxe_electricite: 1000
  output:
    taxe_accise_electricite: 0

- name: exoneration doubles usages 2023
  period: 2023
  input:
    electricite_double_usage: 500
    assiette_taxe_electricite: 1000
  output:
    taxe_accise_electricite: 0

