# L'assiette de l'accise sur l'électricité est mensuelle depuis la bascule en
# definition_period = MONTH. Les trois cas qui vérifient sa composition — quelles consommations
# s'ajoutent, lesquelles se retranchent — sont purement linéaires : les énoncer au mois plutôt
# qu'à l'année laisse les quantités et les attendus inchangés. Seule la maille change.

- name: test 2022 assiette_taxe_electricite
  period: 2022-01
  input:
    consommation_electricite: 10000
    consommation_electricite_energie_ou_gaz_renouvelable: 1000
    consommation_electricite_puissance_moins_1_MW: 1000
    consommation_electricite_auto_consommation: 1000
  output:
    assiette_taxe_electricite: 7000


- name: test assiette 2011
  period: 2011-01
  input:
    consommation_electricite : 1000
    consommation_electricite_petite_producteur_electricite : 200
    consommation_electricite_auto_consommation : 200
  output:
    assiette_taxe_electricite: 600

- name: test assiette 2017
  period: 2017-01
  input:
    consommation_electricite : 1000
    consommation_electricite_petite_producteur_electricite : 200
    consommation_electricite_auto_consommation : 200
    consommation_electricite_puissance_moins_1_MW : 200
  output:
    assiette_taxe_electricite: 400


- name: test 2022 classification double usage
  period: 2022
  input:
    apet : _25_50A
  output:
    apet: _25_50A
    electricite_double_usage: 1

- name: test 2024 classification electricite_transport_guide
  period: 2024
  input:
    apet : _53_10Z
  output:
    apet : _53_10Z
    electricite_transport_guide: 1

- name: test 2024 classification electricite_fabrication_produits_mineraux_non_metalliques
  period: 2024
  input:
    apet : _23_99Z
  output:
    electricite_fabrication_produits_mineraux_non_metalliques: 1

- name: test 2024 classification electricite_centres_de_stockage_donnees
  period: 2025
  input:
    apet:
      2025: _63_11Z
  output:
    apet: _63_11Z
    electricite_centres_de_stockage_donnees: 1


- name: test formule electro_intensite
  period: 2025
  relative_error_margin: 0.000001
  input: #22500/100000
    consommation_electricite : 1000
    #*22.5
    valeur_ajoutee_eta: 100000
  output:
    electro_intensite: 0.225

# relative_error_margin : le numérateur somme des consommations devenues mensuelles, stockées
# au douzième en float32 par set_input_divide_by_period. Leur recomposition sur douze mois ne
# restitue pas la quantité annuelle au bit près : l'écart observé est de 1,1e-7 en relatif.
- name: test formule intensite_energetique_valeur_ajoutee
  period: 2025
  relative_error_margin: 0.000001
  input:
    valeur_ajoutee_eta: 100000 #(22500 + 14620 + 19047.6)/100000
    consommation_electricite : 1000
    #*22.5
    consommation_charbon : 1000
    #*14.62
    consommation_gaz_naturel : 1000
    #*17.16
  output:
    # 2026-07 : depuis la réforme CIBS, le numérateur s'apprécie au tarif normal de
    # l'accise (L312-44) et non plus à celui de la TICGN, clôturée au 2022-01-01.
    # En 2025 le tarif accise gaz combustible est indexé à 17.16 (la série TICGN
    # s'arrêtait à 16.37). L'attendu passe de 0.55290705 à 0.561676.
    # 2026-08 : la conversion PCS/PCI de 1.11 est retirée — la quantité déclarée suit
    # l'unité dans laquelle la loi exprime le tarif du millésime, il n'y a donc jamais
    # deux unités à réconcilier. L'attendu passe de 0.561676 à 0.5428 :
    # (22500 + 14620 + 17160) / 100000.
    # NB : ce cas de test est dupliqué dans
    # autres_variables/variables_economiques/test_valeur_ajoutee.yaml
    intensite_energetique_valeur_ajoutee: 0.5428
