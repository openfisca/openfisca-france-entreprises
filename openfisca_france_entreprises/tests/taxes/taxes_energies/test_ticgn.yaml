# relative_error_margin : depuis la bascule mensuelle, l'assiette est stockée au douzième en
# float32 par set_input_divide_by_period, et sa recomposition sur douze mois ne restitue pas la
# quantité annuelle au bit près. L'écart observé est d'au plus 3,1e-7 en relatif. La marge de
# 1e-6 couvre ce bruit d'arithmétique sans masquer le moindre écart de tarif — le plus petit pas
# tarifaire du barème est de 0,01 €/MWh, soit six ordres de grandeur au-dessus.
# Elle remplace ici l'ancienne marge absolue de 1, devenue trop serrée pour la même raison.

- name: "Test 1986"
  period: 1986
  relative_error_margin: 0.000001
  input:
    assiette_ticgn : 6500000
  output:
    # 2026-07 : taux 1986 corrigé de 9.15 (typo) à 9.5 d'après le barème IPP.
    # (6500000 - 400000*12) * 9.5 = 16150000
    taxe_interieure_consommation_gaz_naturel : 16150000
    #(6500000 - 400000*12)*9.15
      # 1000000 - (200000 + 100000 + 50000)
#en utilisant formula_1986_01_01
#le seuil existe jusqu'à 2008

