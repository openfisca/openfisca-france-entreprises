# Test coefficient TCCFE pour (département 1, commune 1) via taux_tccfe
# taux_tccfe = taux_professionnel_36kVA_et_moins * coefficient.
# Le tarif de référence vaut 0.75 jusqu'en 2018, puis 0.76 en 2019, 0.77 en 2020 et 0.78
# à partir de 2021 (cf. tcfe/taux_professionnel_36kVA_et_moins.yaml).
- name: "Coefficient TCCFE 2011 (1_1) via taux_tccfe"
  period: "2011"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    taux_tccfe: 6.09

# 2012 : coefficient 8.12 -> 0.75 * 8.12 = 6.09
- name: "Coefficient TCCFE 2012 (1_1) via taux_tccfe"
  period: "2012"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    taux_tccfe: 6.09

# 2013 : coefficient 8.28 -> 0.75 * 8.28 = 6.21
- name: "Coefficient TCCFE 2013 (1_1) via taux_tccfe"
  period: "2013"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    taux_tccfe: 6.21

# 2018 : coefficient 8.5 -> 0.75 * 8.5 = 6.375
- name: "Coefficient TCCFE 2018 (1_1) via taux_tccfe"
  period: "2018"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    taux_tccfe: 6.375

# 2022 : coefficient 8.5 -> 0.78 * 8.5 = 6.63
- name: "Coefficient TCCFE 2022 (1_1) via taux_tccfe"
  period: "2022"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    # 2026-07 : le tarif de référence était figé à 0.75 depuis 2011, alors que le barème
    # IPP l'indexe à 0.78 à partir de 2021. L'attendu passe de 6.375 à 6.63.
    taux_tccfe: 6.63

# 2023 : la TCCFE est incorporée à l'accise sur l'électricité, le taux propre devient nul
- name: "Coefficient TCCFE 2023 : incorporation à l'accise"
  period: "2023"
  input:
    amperage: 22
    departement: "1"
    commune: "1"
  output:
    taux_tccfe: 0

# Clé manquant (coefficient 0) : dep=manqu, commune=ant -> key "manquant" -> taux_tccfe = 0
- name: "Coefficient TCCFE manquant (clé par défaut) -> taux_tccfe 0"
  period: "2011"
  input:
    amperage: 22
    departement: "manqu"
    commune: "ant"
  output:
    taux_tccfe: 0
